version: '3.8'

services:
  agent-registry:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://kya_user:kya_password@postgres:5432/kya_db
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kya_user
      POSTGRES_PASSWORD: kya_password
      POSTGRES_DB: kya_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kya_user -d kya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
